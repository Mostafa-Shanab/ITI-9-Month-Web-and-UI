<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1</title>
    <style>
      body {
        font-family: sans-serif;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        display: grid;
        grid-template-areas:
          "header header header"
          "intro slider slider"
          "services services services"
          "services services services"
          "twitter twitter twitter"
          "footer footer footer";
        gap: 15px;
      }

      header {
        grid-area: header;
        background: #cfcfcf;
        padding: 15px;
        display: grid;
        grid-template-areas: "logo nav nav";
      }
      header nav {
        grid-area: nav;
        justify-self: end;
      }
      header .logo {
        grid-area: logo;
      }

      .intro {
        grid-area: intro;
        background: #cfcfcf;
        padding: 20px;
      }
      .slider {
        grid-area: slider;
        background: #cfcfcf;
        padding: 20px;
      }

      .services {
        grid-area: services;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .services > * {
        background: #cfcfcf;
        padding: 20px;
        text-align: center;
      }

      .twitter {
        grid-area: twitter;
        background: #cfcfcf;
        padding: 20px;
      }

      footer {
        grid-area: footer;
        background: #cfcfcf;
        padding: 10px 15px;
        display: grid;
        grid-template-columns: 1fr auto;
      }
      .footer-links {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(55px, auto));
      }

      @media (max-width: 768px) {
        .container {
          grid-template-areas:
            "header"
            "intro"
            "slider"
            "services"
            "twitter"
            "footer";
        }

        .services {
          grid-template-columns: 1fr;
        }

        header {
          grid-template-areas:
            "logo"
            "nav";
          gap: 10px;
        }

        header nav {
          justify-self: start;
        }

        footer {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">Logo</div>
        <nav>
          <a>Link1</a>
          <a>Link2</a>
          <a>Link3</a>
          <a>Link4</a>
          <a>Link5</a>
        </nav>
      </header>

      <section class="intro">
        <h2 style="margin: 0">Intro</h2>
        <p style="margin: 0">
          Some introduction lines about the website or company
        </p>
      </section>
      <section class="slider">
        <p>Featured Project Slider</p>
      </section>

      <section class="services">
        <div>Services</div>
        <div>Services</div>
        <div>Services</div>
        <div>Recent Work</div>
        <div>Recent Work</div>
        <div>Recent Work</div>
      </section>

      <section class="twitter">Twitter Feed</section>

      <footer>
        <div class="footer-links">
          <li>Link1</li>
          <li>Link2</li>
          <li>Link3</li>
          <li>Link4</li>
          <li>Link5</li>
        </div>
        <div class="copyright">copyright info</div>
      </footer>
    </div>
  </body>
</html>
