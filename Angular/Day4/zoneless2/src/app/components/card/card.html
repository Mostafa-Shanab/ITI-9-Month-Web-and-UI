<div class="card h-100 shadow-sm mb-2">
  <img src="" class="w-25" alt="Product Image" />

  <div class="card-body d-flex flex-column">
    <div class="mb-2">
      <h6 class="card-title mb-1">{{prod.id}}</h6>
      <h6 class="card-title mb-1">{{prod.name}}</h6>
      <small class="text-muted">Category</small>
    </div>

    <p class="card-text small text-muted grow">
      Short product description goes here to give quick info about the product.
    </p>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="fw-bold text-primary">$99.99</span>
      <span class="badge bg-light text-dark">Stock: 10</span>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary btn-sm w-100">Add to Cart</button>
    </div>
  </div>
</div>
