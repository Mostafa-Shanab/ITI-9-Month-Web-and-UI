<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: serif;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin: 50px;
      }
      .text-label {
        font-weight: bold;
        font-size: 24px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      math {
        color: #d12d2d;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <canvas id="pythagorasCanvas" width="300" height="250"></canvas>

    <div class="text-label">according to pythagoras theorem</div>

    <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
      <mi>c</mi>
      <mo>=</mo>
      <msqrt>
        <msup>
          <mi>a</mi>
          <mn>2</mn>
        </msup>
        <mo>+</mo>
        <msup>
          <mi>b</mi>
          <mn>2</mn>
        </msup>
      </msqrt>
    </math>

    <script>
      const canvas = document.getElementById("pythagorasCanvas");
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.moveTo(50, 200);
      ctx.lineTo(150, 200);
      ctx.lineTo(150, 30);
      ctx.closePath();

      ctx.fillStyle = "red";
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.font = "20px serif";

      ctx.fillText("a", 95, 225);
      ctx.fillText("b", 160, 120);
      ctx.fillText("c", 70, 115);
    </script>
  </body>
</html>
