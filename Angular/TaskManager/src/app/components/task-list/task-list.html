<div class="task-list-header">
  <div class="tabs">
    <button (click)="selectedTab = 'all'" [class.active]="selectedTab === 'all'">All Tasks</button>
    <button (click)="selectedTab = 'done'" [class.active]="selectedTab === 'done'">Done</button>
    <button (click)="selectedTab = 'notDone'" [class.active]="selectedTab === 'notDone'">
      Not Done
    </button>
  </div>

  <div class="stats">
    <span>{{ stats.total }} total</span>
    <span>{{ stats.done }} done</span>
    <span>{{ stats.pending }} pending</span>
  </div>
</div>

@switch (selectedTab) {
  @case ('all') {
    <app-task-view
      [tasks]="tasks"
      view="all"
      (delete)="deleteTask($event)"
      (toggle)="toggleDone($event)"
      (edit)="onEdit($event)"
      (componentClosed)="onViewClosed($event)"
    ></app-task-view>
  }
  @case ('done') {
    <app-task-view
      [tasks]="tasks"
      view="done"
      (delete)="deleteTask($event)"
      (toggle)="toggleDone($event)"
      (edit)="onEdit($event)"
      (componentClosed)="onViewClosed($event)"
    ></app-task-view>
  }
  @case ('notDone') {
    <app-task-view
      [tasks]="tasks"
      view="notDone"
      (delete)="deleteTask($event)"
      (toggle)="toggleDone($event)"
      (edit)="onEdit($event)"
      (componentClosed)="onViewClosed($event)"
    ></app-task-view>
  }
}
