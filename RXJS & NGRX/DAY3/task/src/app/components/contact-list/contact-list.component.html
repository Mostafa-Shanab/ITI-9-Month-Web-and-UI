<div class="bg-green-50 border border-green-200 rounded-3xl p-6 shadow-sm h-full flex flex-col">
  <h3 class="text-sm font-semibold text-green-800 mb-4 tracking-wider uppercase">Component 1</h3>
  
  <div class="overflow-x-auto flex-grow">
    <table class="w-full border-collapse border border-green-300 text-left rounded-xl overflow-hidden">
      <thead>
        <tr class="bg-green-200 text-green-900 font-bold text-sm">
          <th class="border border-green-300 px-4 py-3 font-semibold">Name</th>
          <th class="border border-green-300 px-4 py-3 font-semibold">Email</th>
          <th class="border border-green-300 px-4 py-3 font-semibold">Phone</th>
        </tr>
      </thead>
      <tbody>
        @for (contact of contacts$ | async; track contact.email + contact.phone) {
          <tr class="hover:bg-green-100/50 transition duration-150 text-green-950 text-sm">
            <td class="border border-green-300 px-4 py-3">{{ contact.name }}</td>
            <td class="border border-green-300 px-4 py-3 break-all">{{ contact.email }}</td>
            <td class="border border-green-300 px-4 py-3">{{ contact.phone }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="border border-green-300 px-4 py-8 text-center text-green-600/70 italic">
              No contacts added yet.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
