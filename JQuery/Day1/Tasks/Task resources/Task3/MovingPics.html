<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving Pictures</title>
    <style>
      #container {
        width: 400px;
        height: 300px;
        border: 5px solid red;
        position: relative;
        margin-bottom: 10px;
      }

      img {
        width: 40px;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <img src="icon1.gif" id="img1" />
      <img src="icon2.gif" id="img2" />
      <img src="TOP.JPG" id="img3" />
    </div>

    <button id="startbtn" onclick="start(this)">Start</button>
    <button onclick="reset()">Reset</button>

    <script src="script.js"></script>
  </body>
</html>
