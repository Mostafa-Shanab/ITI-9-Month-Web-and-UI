<!doctype html>
<html>
  <head>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }
      canvas {
        background-color: white;
      }
    </style>
  </head>
  <body>
    <canvas id="goalCanvas" width="400" height="400"></canvas>

    <script>
      const canvas = document.getElementById("goalCanvas");
      const ctx = canvas.getContext("2d");

      const padding = 40;
      const innerSize = 320;
      const horizon = padding + innerSize / 2;

      ctx.lineWidth = 2;
      ctx.strokeStyle = "black";
      ctx.strokeRect(10, 10, 380, 380);

      const skyGrad = ctx.createLinearGradient(0, padding, 0, horizon);
      skyGrad.addColorStop(0, "#4ebfff");
      skyGrad.addColorStop(1, "white");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(padding, padding, innerSize, innerSize / 2);

      const grassGrad = ctx.createLinearGradient(
        0,
        horizon,
        0,
        padding + innerSize,
      );
      grassGrad.addColorStop(0, "#5dbb1e");
      grassGrad.addColorStop(1, "white");
      ctx.fillStyle = grassGrad;
      ctx.fillRect(padding, horizon, innerSize, innerSize / 2);

      ctx.beginPath();
      ctx.moveTo(130, horizon + 20);
      ctx.lineTo(130, horizon - 50);
      ctx.lineTo(270, horizon - 50);
      ctx.lineTo(270, horizon + 20);
      ctx.strokeStyle = "black";
      ctx.lineWidth = 2;
      ctx.stroke();
    </script>
  </body>
</html>
