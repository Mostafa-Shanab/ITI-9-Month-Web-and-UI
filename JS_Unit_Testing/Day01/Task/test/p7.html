<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problem 7 — Form Validation + Mocha/Chai</title>

    <!-- Mocha CSS for test results -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.4.0/mocha.min.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0f;
        --surface: #16161a;
        --border: #2a2a32;
        --accent: #f0e040;
        --accent2: #40d9f0;
        --text: #e8e8f0;
        --muted: #7070a0;
        --pass: #40f08a;
        --fail: #f05060;
        --radius: 10px;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Syne", sans-serif;
        min-height: 100vh;
        padding: 40px 24px;
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }

      h1 span {
        color: var(--accent);
      }

      .subtitle {
        font-family: "JetBrains Mono", monospace;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 36px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 960px;
      }

      @media (max-width: 680px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
      }

      .card h2 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent2);
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        padding: 10px 14px;
        margin-bottom: 18px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--accent);
      }

      .error-msg {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--fail);
        margin-top: -14px;
        margin-bottom: 12px;
        min-height: 1em;
      }

      button {
        background: var(--accent);
        color: #0d0d0f;
        border: none;
        border-radius: 6px;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 11px 28px;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.1s;
        width: 100%;
      }

      button:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }

      .result-box {
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 6px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        display: none;
      }

      .result-box.success {
        background: #0d2a1a;
        color: var(--pass);
        border: 1px solid var(--pass);
      }
      .result-box.failure {
        background: #2a0d12;
        color: var(--fail);
        border: 1px solid var(--fail);
      }

      /* Mocha styles override */
      #mocha {
        font-family: "JetBrains Mono", monospace !important;
        font-size: 0.8rem;
      }

      #mocha h2 {
        color: var(--text) !important;
        font-family: "Syne", sans-serif !important;
      }
      #mocha .suite .suite h1,
      #mocha .suite h1 {
        color: var(--accent2) !important;
        font-size: 0.85rem !important;
      }
      #mocha .test.pass .duration {
        color: var(--muted) !important;
      }
      #mocha .test.pass::before {
        color: var(--pass) !important;
      }
      #mocha .test.fail::before {
        color: var(--fail) !important;
      }
      #mocha #mocha-stats {
        color: var(--muted) !important;
      }
      #mocha #mocha-stats .passes {
        color: var(--pass) !important;
      }
      #mocha #mocha-stats .failures {
        color: var(--fail) !important;
      }
      #mocha a {
        color: var(--accent) !important;
      }

      .run-btn-wrap {
        margin-top: 16px;
      }

      .run-btn {
        background: transparent;
        border: 1px solid var(--accent2);
        color: var(--accent2);
        width: auto;
        padding: 8px 20px;
        font-size: 0.8rem;
      }
      .run-btn:hover {
        background: var(--accent2);
        color: var(--bg);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Problem <span>7</span></h1>
    <p class="subtitle">// form validation · mocha + chai · browser runner</p>

    <div class="layout">
      <!-- FORM CARD -->
      <div class="card">
        <h2>Form</h2>

        <label for="numInput">Number Input</label>
        <input type="text" id="numInput" placeholder="e.g. 42" />
        <div class="error-msg" id="numError"></div>

        <label for="strInput">String Input</label>
        <input type="text" id="strInput" placeholder="e.g. hello" />
        <div class="error-msg" id="strError"></div>

        <button onclick="handleSubmit()">Validate & Submit</button>

        <div class="result-box" id="resultBox"></div>
      </div>

      <!-- TEST CARD -->
      <div class="card">
        <h2>Unit Tests</h2>
        <div id="mocha"></div>
        <div class="run-btn-wrap">
          <button class="run-btn" onclick="runTests()">▶ Run Tests</button>
        </div>
      </div>
    </div>

    <!-- Mocha + Chai from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.4.0/mocha.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.4.1/chai.min.js"></script>

    <script>
      // ─── Validation functions (what we're testing) ────────────────────────────

      function validateNumber(value) {
        const num = Number(value);
        if (value === "" || value === null || value === undefined)
          throw new Error("Number input is required");
        if (isNaN(num)) throw new Error("Input must be a valid number");
        return num;
      }

      function validateString(value) {
        if (typeof value !== "string")
          throw new TypeError("Input must be a string");
        if (value.trim() === "")
          throw new Error("String input cannot be empty");
        if (value.trim().length < 2)
          throw new Error("String must be at least 2 characters");
        return value.trim();
      }

      function validateForm(numValue, strValue) {
        const num = validateNumber(numValue);
        const str = validateString(strValue);
        return { num, str };
      }

      // ─── Form submit handler ──────────────────────────────────────────────────

      function handleSubmit() {
        const numVal = document.getElementById("numInput").value;
        const strVal = document.getElementById("strInput").value;
        const numErr = document.getElementById("numError");
        const strErr = document.getElementById("strError");
        const box = document.getElementById("resultBox");

        numErr.textContent = "";
        strErr.textContent = "";
        box.style.display = "none";

        let valid = true;

        try {
          validateNumber(numVal);
        } catch (e) {
          numErr.textContent = "✗ " + e.message;
          valid = false;
        }

        try {
          validateString(strVal);
        } catch (e) {
          strErr.textContent = "✗ " + e.message;
          valid = false;
        }

        if (valid) {
          box.className = "result-box success";
          box.textContent = `✓ Valid! number = ${numVal}, string = "${strVal}"`;
          box.style.display = "block";
        } else {
          box.className = "result-box failure";
          box.textContent = "✗ Fix the errors above and try again.";
          box.style.display = "block";
        }
      }

      // ─── Mocha / Chai Tests ───────────────────────────────────────────────────

      const { expect, should, assert } = chai;
      should(); // enables .should on objects

      function runTests() {
        // Reset mocha between runs
        mocha.suite.suites = [];
        mocha.suite.tests = [];
        document.getElementById("mocha").innerHTML = "";

        mocha.setup({ ui: "bdd", reporter: "html" });

        // ── validateNumber ────────────────────────────────────────────────────
        describe("validateNumber()", function () {
          it("returns a number when given a valid numeric string", function () {
            expect(validateNumber("42")).to.equal(42);
          });

          it("returns 0 when given '0'", function () {
            assert.strictEqual(validateNumber("0"), 0);
          });

          it("throws when input is empty string", function () {
            expect(() => validateNumber("")).to.throw(
              "Number input is required",
            );
          });

          it("throws when input is not a number", function () {
            expect(() => validateNumber("abc")).to.throw(
              "Input must be a valid number",
            );
          });

          it("returned value should be a number type", function () {
            validateNumber("7").should.be.a("number");
          });
        });

        // ── validateString ────────────────────────────────────────────────────
        describe("validateString()", function () {
          it("returns trimmed string for valid input", function () {
            expect(validateString("  hello  ")).to.equal("hello");
          });

          it("throws when given empty string", function () {
            expect(() => validateString("")).to.throw(
              "String input cannot be empty",
            );
          });

          it("throws when string is only whitespace", function () {
            assert.throws(() => validateString("   "), /empty/i);
          });

          it("throws when string is too short (< 2 chars)", function () {
            expect(() => validateString("a")).to.throw("at least 2 characters");
          });

          it("throws TypeError when given a non-string", function () {
            expect(() => validateString(123)).to.throw(TypeError);
          });

          it("result should be a string", function () {
            validateString("mocha").should.be.a("string");
          });
        });

        // ── validateForm ──────────────────────────────────────────────────────
        describe("validateForm()", function () {
          it("returns an object with num and str keys on valid input", function () {
            const result = validateForm("5", "chai");
            expect(result).to.have.keys(["num", "str"]);
          });

          it("result.num equals the parsed number", function () {
            assert.strictEqual(validateForm("10", "test").num, 10);
          });

          it("result.str equals the trimmed string", function () {
            validateForm("3", "  mocha  ").str.should.equal("mocha");
          });

          it("throws when number part is invalid", function () {
            expect(() => validateForm("", "valid")).to.throw();
          });

          it("throws when string part is invalid", function () {
            expect(() => validateForm("5", "")).to.throw();
          });
        });

        mocha.run();
      }
    </script>
  </body>
</html>
