<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2</title>
    <style>
      body {
        background: #49a7c9;
      }

      .container {
        display: grid;
        justify-content: center;
        padding: 55px;
      }

      .grid {
        width: 400px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 150px);
        gap: 6px;
        /* transform: rotate(45deg); */
      }

      .box {
        background: #3b3b3b;
        color: white;
        text-align: center;
        padding: 15px;
      }
      .box1 {
        grid-column: 2 / -1;
      }
      .box2 {
        grid-column: 3 / -1;
        grid-row: 2 / -1;
      }
      .box4 {
        grid-column: 1 / 3;
      }
      .box5 {
        grid-column: 1 / 2;
        grid-row: 1 / -2;
      }

      @media (max-width: 767px) {
        .grid {
          animation: rotateGrid 5s linear infinite;
          width: 225px;
          grid-template-rows: repeat(3, 55px);
        }

        .box {
          animation: colorChange 5s ease-in-out infinite alternate;
        }
      }

      @keyframes rotateGrid {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes colorChange {
        0% {
          background: #3b3b3b;
        }
        25% {
          background: #ff0000;
        }
        50% {
          background: #00ffcc;
        }
        75% {
          background: #ffcc00;
        }
        100% {
          background: #3b3b3b;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
      </div>
    </div>
  </body>
</html>
