<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="idb.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To do list</h1>
        <button
          id="enableNotificationsBtn"
          class="notification-btn"
          style="display: none"
        >
          Enable Notifications
        </button>
      </header>

      <div class="add-task-section">
        <h2>Add new to do.</h2>

        <div class="form-group">
          <label for="taskTitle">Task title:</label>
          <input type="text" id="taskTitle" placeholder="Enter task title" />
        </div>

        <div class="time-group">
          <div class="form-group">
            <label for="hours">Hours (hh):</label>
            <input type="number" id="hours" min="0" max="23" placeholder="00" />
          </div>

          <div class="form-group">
            <label for="minutes">Mins (mm):</label>
            <input
              type="number"
              id="minutes"
              min="0"
              max="59"
              placeholder="00"
            />
          </div>
        </div>

        <div class="date-group">
          <div class="form-group">
            <label for="day">Day:</label>
            <select id="day"></select>
          </div>

          <div class="form-group">
            <label for="month">Month:</label>
            <select id="month">
              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
          </div>

          <div class="form-group">
            <label for="year">Year:</label>
            <select id="year"></select>
          </div>
        </div>

        <button id="addTaskBtn" class="add-btn">Add Task</button>
      </div>

      <div class="tasks-section">
        <h2>Your Tasks</h2>
        <button
          id="enableNotificationsBtn"
          class="notification-btn"
          style="display: none"
        >
          Enable Notifications
        </button>
        <button
          id="testNotificationBtn"
          class="test-notification-btn"
          style="display: none"
        >
          Test Notification
        </button>
        <div id="tasksList"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
