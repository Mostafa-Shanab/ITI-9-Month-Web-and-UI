<div class="carousel">
  <img [src]="images[currentIndex]" />

  <button class="arrow left" (click)="prev()">←</button>

  <button class="arrow right" (click)="next()">→</button>

  <div class="dots">
    @for (image of images; track $index) {
      <span (click)="goTo($index)" [class.active]="currentIndex === $index"></span>
    }
  </div>
</div>
